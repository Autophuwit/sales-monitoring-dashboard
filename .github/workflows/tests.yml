name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ETL tests (Python)
        run: |
          pip install "pandas>=2.0" "openpyxl>=3.1"   # pyodbc is stubbed in the tests, no SQL Server needed
          python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Metric engine tests (JavaScript)
        run: node --test tests/

      - name: Syntax check of the page scripts
        run: for f in assets/*.js; do node --check "$f"; done
